spring:
  application:
    name: mungroute-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

security:
  jwt:
    # 운영 환경에서는 반드시 32바이트 이상의 무작위 JWT_SECRET을 주입한다.
    secret: ${JWT_SECRET:local-development-secret-change-me-1234567890}
    issuer: mungroute
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  password-reset:
    verification-ttl: 10m
    reset-token-ttl: 10m
    # 메일 연동 전 로컬 데모에서만 응답에 인증번호를 포함한다.
    expose-code: ${PASSWORD_RESET_EXPOSE_CODE:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

server:
  port: ${PORT:8080}

course:
  routing:
    candidate-count: 3
    shade-alpha: 2.0
    section-detour-ratio: 0.40
    max-swapped-sections: 2

external:
  kma:
    asos:
      base-url: ${KMA_ASOS_BASE_URL:https://apihub.kma.go.kr}
      auth-key: ${KMA_API_HUB_AUTH_KEY:}
      station-id: ${KMA_ASOS_STATION_ID:108}
      cache-ttl: ${KMA_ASOS_CACHE_TTL:10m}
      stale-ttl: ${KMA_ASOS_STALE_TTL:2h}
      retry-delay: ${KMA_ASOS_RETRY_DELAY:1m}
      live-request-window: ${KMA_ASOS_LIVE_REQUEST_WINDOW:90m}
  food-safety:
    pet-restaurants:
      export-url: ${FOOD_SAFETY_PET_RESTAURANTS_EXPORT_URL:https://www.foodsafetykorea.go.kr/portal/petKorea/downloadExcel.do}
      cache-ttl: ${FOOD_SAFETY_PET_RESTAURANTS_CACHE_TTL:6h}
  kakao:
    local:
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_REST_API_KEY:}
  kto:
    pet-tour:
      base-url: ${KTO_PET_TOUR_BASE_URL:https://apis.data.go.kr/B551011/KorPetTourService2}
      service-key: ${KTO_PET_TOUR_SERVICE_KEY:}
      mobile-os: ${KTO_PET_TOUR_MOBILE_OS:ETC}
      mobile-app: ${KTO_PET_TOUR_MOBILE_APP:MungRoute}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway,prometheus,metrics

  metrics:
    distribution:
      percentiles-histogram:
        mungroute.websocket.message: true
        mungroute.websocket.queue.delay: true
        mungroute.presence.stage: true

  endpoint:
    health:
      show-details: always
