services:
  db:
    image: ${POSTGIS_IMAGE}
    container_name: ${DB_CONTAINER_NAME}

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - mungroute-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${REDIS_CONTAINER_NAME}

    ports:
      - "${REDIS_PORT}:6379"

    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

volumes:
  mungroute-db-data: